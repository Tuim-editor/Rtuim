[package]
name = "tuim"
version = "0.4.0"
edition = "2021"
description = "Modern terminal workspace and IDE in Rust inspired by Fresh editor, powered by Neovim"
license = "MIT"

[[bin]]
name = "tuim"
path = "src/main.rs"

[lib]
name = "tuim"
path = "src/lib.rs"

[dependencies]
crossterm = "0.28"
rmpv = "1.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
unicode-width = "0.2"
portable-pty = "0.9"
vt100 = "0.16"
